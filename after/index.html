<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portello Labs</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta http-equiv="refresh" content="0; url=https://forms.gle/K22z6wESVXGB3C657" />
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/favicon-32.png" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0a;
      --ink: #ededed;
      --ink-soft: #8a8a8a;
      --brand: #95ff77;
      --accent: #1b02a4;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; }

    body {
      font-family: "Inter", system-ui, sans-serif;
      background: radial-gradient(circle at 10% -10%, var(--accent) 0%, var(--bg) 42%), var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
    }

    .mark {
      font-family: "Sora", sans-serif;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--brand);
      margin-bottom: 26px;
    }

    h1 {
      font-family: "Sora", sans-serif;
      font-size: clamp(22px, 5vw, 30px);
      line-height: 1.25;
      margin: 0 0 12px;
    }

    p { color: var(--ink-soft); font-size: 15px; margin: 0; }

    a { color: var(--brand); text-decoration: none; border-bottom: 1px solid rgba(149, 255, 119, .45); }
    a:hover { border-bottom-color: var(--brand); }

    .dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--brand);
      margin-right: 8px;
      animation: pulse 1.1s ease-in-out infinite;
      vertical-align: middle;
    }

    @keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  </style>
</head>

<body>
  <main>
    <div class="mark">Portello Labs</div>
    <h1><span class="dot" aria-hidden="true"></span>Abrindo o formulário…</h1>
    <p>Se não abrir sozinho, <a href="https://forms.gle/K22z6wESVXGB3C657">clique aqui</a>.</p>
  </main>
  <script>
    window.location.replace("https://forms.gle/K22z6wESVXGB3C657");
  </script>
</body>

</html>
